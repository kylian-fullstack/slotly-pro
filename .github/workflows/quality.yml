name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: slotly
          POSTGRES_PASSWORD: slotly_ci_only
          POSTGRES_DB: slotly_test
        ports:
          - 45432:5432
        options: >-
          --health-cmd "pg_isready -U slotly -d slotly_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://slotly:slotly_ci_only@127.0.0.1:45432/slotly_test
      TEST_DATABASE_URL: postgresql://slotly:slotly_ci_only@127.0.0.1:45432/slotly_test
      TEST_DATABASE_MARKER: slotly_test_only
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      PUBLIC_REGISTRATION_ENABLED: "false"
      TEST_SEED_ENABLED: "false"
      RATE_LIMIT_BACKEND: postgres
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mark and migrate isolated test database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE slotly_test IS 'slotly_test_only'"
          pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - name: Run production API journey
        run: |
          PUBLIC_REGISTRATION_ENABLED=true NODE_ENV=production pnpm --filter @slotly/web start --hostname 127.0.0.1 --port 3100 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:3100/api/v1/health && break; sleep 1; done
          TEST_URL=http://127.0.0.1:3100 node tests/api/auth-flow.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=desktop-chromium
